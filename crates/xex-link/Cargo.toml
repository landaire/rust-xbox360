[package]
name = "xex-link"
version = "0.1.0"
edition = "2024"
description = "Link a PPC ELF into an Xbox 360 PE image and wrap it as a XEX"

[dependencies]
object = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
bitflags = "2.13"
byteorder = "1.5"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
thiserror = "2.0"
rootcause = "0.12"
xex2 = { version = "0.4", git = "https://github.com/landaire/acceleration", rev = "0705839ac6c4d78afb0acff321666f40e642c146" }
xenon_types = { version = "0.4", git = "https://github.com/landaire/acceleration", rev = "0705839ac6c4d78afb0acff321666f40e642c146" }
